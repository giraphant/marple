[package]
name = "reader-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Spike crate (Phase 0): verify BGE-M3 + fastembed-rs + sqlite-vec on real
# vault data. Throwaway — will be deleted once the production code lands in
# reader-core.

[dependencies]
anyhow = { workspace = true }
fastembed = "5.0"
sqlite-vec = "0.1"
rusqlite = { workspace = true, features = ["bundled", "load_extension"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[[bin]]
name = "spike-infra"
path = "src/spike_infra.rs"

[[bin]]
name = "spike-vault"
path = "src/spike_vault.rs"
