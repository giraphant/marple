[workspace]
members = ["reader-core", "reader-api", "reader-index", "reader-spike"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastembed = "5.13"
http = "1.1"
mime_guess = "2.0"
reader-core = { path = "reader-core" }
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlite-vec = "0.1"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
