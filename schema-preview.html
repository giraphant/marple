      { h2: '关键概念',  req: true,  kind: 'table',           coverage: '62%', note: '⚠️ 当前 88% paragraph · 一次性 autofix via 迁移 agent' },
      { h2: '核心引用',  req: true,  kind: 'numbered-list',   coverage: '59%', note: '原 "核心引用文献" (6→4) · 当前 75% mixed,归一' },
      { h2: '金句要点',  req: false, kind: 'blockquote-list', coverage: '1%',  highlight: '100% blockquote · BibTeX 友好', note: '原 "可引用段落" (5→4) · 跨 type 同名同 kind' },
      { h2: '项目关联',  req: false, kind: 'h3-project-tabs', childKind: 'numbered-list', coverage: '~25%', note: '原 "与 X 的关联"' },
    ],
  },
};

// ---- components ----

const KIND_COLORS = {
  'paragraph':       'bg-stone-100 text-stone-700',
  'bullet-list':     'bg-blue-100  text-blue-800',
  'numbered-list':   'bg-indigo-100 text-indigo-800',
  'table':           'bg-emerald-100 text-emerald-800',
  'blockquote-list': 'bg-purple-100 text-purple-800',
  'definition-list': 'bg-pink-100 text-pink-800',
  'h3-project-tabs': 'bg-orange-100 text-orange-800',
  'h3-sections':     'bg-rose-100 text-rose-800',
  'mixed':           'bg-yellow-100 text-yellow-800',
};

function BodySchemaRow({ s }) {
  const reqDot = s.req
    ? html`<span class="pill bg-rose-100 text-rose-700">req</span>`
    : html`<span class="pill bg-stone-100 text-stone-500">opt</span>`;
  const kindClass = KIND_COLORS[s.kind] || 'bg-stone-100 text-stone-700';
  return html`
    <div class="grid grid-cols-[1fr_60px_160px_70px_1fr] gap-3 py-1.5 text-[12px] border-b border-stone-100 last:border-0 items-center">
      <div class="font-mono text-purple-800">## ${s.h2}</div>
      <div>${reqDot}</div>
      <div>
        <span class="pill ${kindClass} font-mono">${s.kind}${s.childKind ? html` <span class="opacity-60">/ ${s.childKind}</span>` : ''}</span>
      </div>
      <div class="text-stone-500 tabular-nums text-right">${s.coverage}</div>
      <div class="text-stone-600 text-[11px]">
        ${s.highlight && html`<div class="text-emerald-700 font-medium mb-0.5">${s.highlight}</div>`}
        ${s.note || ''}
      </div>
    </div>
  `;
}

function FieldRow({ f }) {
  const reqDot = f.req
    ? html`<span class="pill bg-rose-100 text-rose-700">req</span>`
    : html`<span class="pill bg-stone-100 text-stone-500">opt</span>`;
  return html`
    <div class="grid grid-cols-[140px_180px_1fr] gap-3 py-1 text-[13px] border-b border-stone-100 last:border-0">
      <div class="font-mono text-purple-800">${f.name}</div>
      <div class="font-mono text-stone-600">${f.kind}</div>
      <div class="flex items-center gap-2 text-stone-600">
        ${reqDot}
        <span>${f.note || ''}</span>
      </div>
    </div>
  `;
}

function YamlBlock({ lines, label, side }) {
  // Each line: ['key' | 'del' | 'empty' | 'add', text, { rename, norm }?]
  return html`
    <div>
      <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">${label}</div>
      <pre class="bg-white border border-stone-200 rounded-md text-[12px] leading-relaxed py-2 overflow-auto">${lines.map(([kind, text, meta]) => {
        const cls = ({
          key: 'yaml-line',
          del: 'yaml-line yaml-del',
          empty: 'yaml-line yaml-empty',
          add: 'yaml-line yaml-add',
        })[kind];
        return html`
          <span class=${cls}>${text}${meta && (meta.rename || meta.norm) && html`<span class="text-[10px] text-stone-500 ml-3">// ${meta.rename || meta.norm}</span>`}</span>
        `;
      })}</pre>
    </div>
  `;
}

function TypePanel({ t, tKey }) {
  return html`
    <div class="bg-white rounded-lg border border-stone-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-stone-200 ${t.accentClasses.border} border-l-4 ${t.accentClasses.headBg}">
        <div class="flex items-baseline gap-3 flex-wrap">
          <div class="font-mono text-lg font-semibold ${t.accentClasses.headText}">${tKey}</div>
          <div class="text-stone-700">${t.label}</div>
          <div class="text-[11px] text-stone-500">·</div>
          <div class="text-[12px] text-stone-500 tabular-nums">${t.count} 条</div>
          <div class="text-[11px] text-stone-500">·</div>
          <div class="text-[12px] text-stone-500 font-mono">${t.pathPattern}</div>
        </div>
        <div class="text-[12px] text-stone-600 mt-1">
          ${t.description}
          <span class="text-stone-400 ml-2">迁移自</span>
          <span class="font-mono text-stone-600">${t.fromType}</span>
        </div>
      </div>

      <div class="px-6 py-5 space-y-6">
        <!-- Schema fields -->
        <section>
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">Schema</div>
          <div class="bg-stone-50 rounded-md border border-stone-200 px-4 py-2">
            ${t.fields.map(f => html`<${FieldRow} f=${f} />`)}
          </div>
        </section>

        <!-- Removed fields -->
        ${t.removed.length > 0 && html`
          <section>
            <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">删除字段</div>
            <ul class="space-y-1 text-[12px]">
              ${t.removed.map(r => html`
                <li class="grid grid-cols-[1fr_60px_2fr] gap-3 py-1 border-b border-stone-100 last:border-0">
                  <div class="font-mono text-rose-700 line-through">${r.name}</div>
                  <div class="text-stone-400 tabular-nums text-right">${r.count} 条</div>
                  <div class="text-stone-600">${r.why}</div>
                </li>
              `)}
            </ul>
          </section>
        `}

        <!-- Renamed fields -->
        ${t.renamed.length > 0 && html`
          <section>
            <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">字段重命名 / 合并</div>
            <ul class="space-y-2 text-[12px]">
              ${t.renamed.map(r => html`
                <li class="py-1 border-b border-stone-100 last:border-0">
                  <div class="flex items-baseline gap-2 flex-wrap">
                    <span class="font-mono text-amber-700">${r.from}</span>
                    <span class="text-stone-400">→</span>
                    <span class="font-mono text-emerald-700">${r.to}</span>
                  </div>
                  <div class="text-stone-600 text-[11px] mt-0.5">${r.why}</div>
                </li>
              `)}
            </ul>
          </section>
        `}

        <!-- Normalized -->
        ${t.normalized.length > 0 && html`
          <section>
            <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">格式归一化</div>
            <ul class="space-y-1 text-[12px]">
              ${t.normalized.map(n => html`
                <li class="grid grid-cols-[1fr_30px_1fr_60px] gap-3 py-1 border-b border-stone-100 last:border-0 items-center">
                  <div class="font-mono text-blue-700">${n.from}</div>
                  <div class="text-stone-400 text-center">→</div>
                  <div class="font-mono text-blue-700">${n.to}</div>
                  <div class="text-stone-400 tabular-nums text-right text-[11px]">${n.count} 条${n.note ? ' *' : ''}</div>
                </li>
              `)}
            </ul>
            ${t.normalized.some(n => n.note) && html`
              <div class="text-[11px] text-stone-500 mt-2 pl-2 border-l-2 border-stone-200">
                * ${t.normalized.filter(n => n.note).map(n => n.note).join(' / ')}
              </div>
            `}
          </section>
        `}

        <!-- Body schema -->
        ${t.bodySchema && t.bodySchema.length > 0 && html`
          <section>
            <div class="flex items-baseline gap-3 mb-2">
              <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">Body Schema</div>
              <div class="text-[11px] text-stone-500">正文 H2 结构 · lint 只查"必填 H2 是否存在 + 形状对不对"</div>
            </div>
            <div class="bg-stone-50 rounded-md border border-stone-200 px-4 py-2">
              <div class="grid grid-cols-[1fr_60px_160px_70px_1fr] gap-3 pb-1.5 mb-1 border-b border-stone-200 text-[10px] uppercase tracking-wider text-stone-500 font-semibold">
                <div>H2 标题</div>
                <div>必填</div>
                <div>block kind</div>
                <div class="text-right">vault 覆盖</div>
                <div>说明</div>
              </div>
              ${t.bodySchema.map(s => html`<${BodySchemaRow} s=${s} />`)}
            </div>
          </section>
        `}

        <!-- Live example -->
        <section>
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">
            真实例子:<span class="text-stone-700 normal-case font-normal ml-2">${t.example.title}</span>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <${YamlBlock} lines=${t.example.current}  label="现在 (vault 实际)" side="current" />
            <${YamlBlock} lines=${t.example.proposed} label="迁移后 (SPEC 形态)" side="proposed" />
          </div>
          ${t.example.note && html`
            <div class="mt-3 text-[12px] text-stone-600 bg-stone-50 border-l-4 border-stone-300 px-3 py-2">
              ${t.example.note}
            </div>
          `}
        </section>
      </div>
    </div>
  `;
}

function App() {
  const keys = Object.keys(TYPES);
  const [active, setActive] = useState(keys[0]);

  return html`
    <div class="min-h-screen">
      <header class="bg-white border-b border-stone-200 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-6 py-3 flex items-center gap-4 flex-wrap">
          <div class="font-semibold text-base">qua schema preview</div>
          <div class="text-[11px] text-stone-500">v0.1.0-draft · 4 entity types · 评审中</div>
          <div class="flex-1"></div>
          <a href="/reader/" class="text-[11px] text-sky-700 hover:underline">← 回 reader</a>
        </div>
        <div class="max-w-6xl mx-auto px-6 pb-3 flex gap-1 flex-wrap">
          ${keys.map(k => html`
            <button
              onClick=${() => setActive(k)}
              class="px-3 py-1.5 rounded text-[13px] transition ${active === k ? TYPES[k].accentClasses.tab : 'text-stone-600 hover:bg-stone-100'}">
              ${k} <span class="opacity-60 text-[11px] tabular-nums ml-1">${TYPES[k].count}</span>
            </button>
          `)}
        </div>
      </header>

      <main class="max-w-6xl mx-auto px-6 py-6 space-y-6">
        <!-- Primitives panel (always visible) -->
        <section class="bg-white rounded-lg border border-stone-200 px-6 py-4">
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">Primitives (共享原语 · primitives.ts)</div>
          <div class="text-[11px] text-stone-500 mb-3">值层面的小工具,被各 schema 按需复用。不是继承基类。</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-[12px]">
            ${Object.entries(PRIMITIVES).map(([name, p]) => html`
              <div class="font-mono">
                <span class="text-purple-800">${name}</span>
                <span class="text-stone-400 mx-2">=</span>
                <span class="text-stone-700">${p.sig}</span>
              </div>
            `)}
          </div>
        </section>

        <!-- Body schema design principles + kind legend -->
        <section class="bg-white rounded-lg border border-stone-200 px-6 py-4">
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">Body Schema 设计原则 + Block Kind 图例</div>
          <ul class="text-[12px] text-stone-700 space-y-1 mb-3 list-disc pl-5">
            <li><strong>H2 标题 4 字中文</strong> —— canonical 标题强制 4 字(部分待你拍 Q1/Q2/Q3)</li>
            <li><strong>跨 type 同名 H2 复用</strong> —— 如 <span class="font-mono">关键概念</span> 在 book / chapter / paper 都用,kind 按 type 分(book = table,其余 = paragraph)</li>
            <li><strong>项目名不进 H2</strong> —— 用固定 H2 <span class="font-mono">项目关联</span> + H3 per project,reader 渲染为 tabs(kind: <span class="font-mono">h3-project-tabs</span>)</li>
            <li><strong>原文小节用 H3</strong> —— <span class="font-mono">分节摘要</span> 之下的 H3 是原文 sub-section(kind: <span class="font-mono">h3-sections</span>),不是项目 tab</li>
          </ul>
          <div class="text-[10px] uppercase tracking-wider text-stone-500 font-semibold mb-1.5">Block kinds</div>
          <div class="flex flex-wrap gap-1.5 text-[11px]">
            ${Object.entries(KIND_COLORS).map(([k, cls]) => html`
              <span class="pill ${cls} font-mono">${k}</span>
            `)}
          </div>
        </section>

        <${TypePanel} t=${TYPES[active]} tKey=${active} />

        <div class="text-[11px] text-stone-500 text-center py-4">
          spec 全文 → <a href="/reader/schemas/SPEC.md" class="text-sky-700 hover:underline font-mono">reader/schemas/SPEC.md</a>
        </div>
      </main>
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
