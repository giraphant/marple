<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>qua reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  .card { content-visibility: auto; contain-intrinsic-size: 220px; }
  .prose-body h1 { font-size: 1.5rem; font-weight: 600; margin: 1.2em 0 0.6em; }
  .prose-body h2 { font-size: 1.2rem; font-weight: 600; margin: 1.1em 0 0.5em; border-bottom: 1px solid #e7e5e4; padding-bottom: 0.2em; }
  .prose-body h3 { font-size: 1.05rem; font-weight: 600; margin: 1em 0 0.4em; }
  .prose-body p { margin: 0.6em 0; line-height: 1.75; }
  .prose-body ul, .prose-body ol { margin: 0.6em 0; padding-left: 1.5em; }
  .prose-body li { margin: 0.2em 0; line-height: 1.7; }
  .prose-body blockquote { border-left: 3px solid #d6d3d1; padding-left: 1em; color: #57534e; margin: 0.8em 0; }
  .prose-body code { background: #f5f5f4; padding: 0 0.3em; border-radius: 3px; font-size: 0.9em; }
  .prose-body strong { font-weight: 600; color: #1c1917; }
  .prose-body hr { border: none; border-top: 1px solid #e7e5e4; margin: 1.4em 0; }
  .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }
  .wiki-link { color: #0369a1; cursor: pointer; border-bottom: 1px dotted #0369a1; }
  .wiki-link:hover { background: #f0f9ff; }
  .wiki-broken { color: #a8a29e; text-decoration: line-through; cursor: help; }
</style>
</head>
<body class="bg-stone-100 text-stone-900">
<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.22.0';
import { useState, useEffect, useMemo, useCallback } from 'https://esm.sh/preact@10.22.0/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { marked } from 'https://esm.sh/marked@12.0.2';

const html = htm.bind(h);

const TYPES = [
  { id: 'paper-analysis',  label: '论文', accent: 'bg-amber-100  text-amber-800  border-amber-200'  },
  { id: 'book-overview',   label: '书',   accent: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
  { id: 'author-profile',  label: '作者', accent: 'bg-sky-100    text-sky-800    border-sky-200'    },
  { id: 'topic-synthesis', label: '主题', accent: 'bg-violet-100 text-violet-800 border-violet-200' },
  { id: 'chapter-summary', label: '章节', accent: 'bg-teal-100   text-teal-800   border-teal-200'   },
];
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));

// --- helpers ---

function splitAuthors(s) {
  if (!s) return [];
  return s.split(/,| & | and /i).map(x => x.trim()).filter(Boolean);
}

function bookSlugOf(entry) {
  // vault/books/<slug>/...
  const m = entry.path.match(/^vault\/books\/([^/]+)\//);
  return m ? m[1] : null;
}

// Build a Map for resolving Obsidian-style [[wikilinks]]. Each entry is
// indexed under several keys observed in the wild: vault-relative path
// without extension, basename alone, book-slug/chapter, book-slug → its
// overview, and lowercased variants of each (case-insensitive lookups).
function buildWikiIndex(entries) {
  const m = new Map();
  const put = (k, v) => {
    if (!k) return;
    if (!m.has(k)) m.set(k, v);
    const lk = k.toLowerCase();
    if (!m.has(lk)) m.set(lk, v);
  };
  for (const e of entries) {
    const noExt = e.path.replace(/^vault\//, '').replace(/\.md$/, '');
    put(noExt, e);
    const base = noExt.split('/').pop();
    put(base, e);
    if (e.type === 'chapter-summary' && e.book) put(`${e.book}/${base}`, e);
    if (e.type === 'book-overview') {
      const slug = bookSlugOf(e);
      if (slug) put(slug, e);
    }
  }
  return m;
}

const WIKI_RE = /\[\[([^\]|\n]+?)(?:\|([^\]\n]+?))?\]\]/g;

// Replace [[target|display]] with an <a> the article click handler can pick up.
// Unresolved links become a strikethrough <span> so you can spot dangling refs.
function resolveWikilinks(md, wikiIndex) {
  return md.replace(WIKI_RE, (_, target, display) => {
    const t = target.trim();
    // Drop anchor fragments (#section) when resolving; keep them in display.
    const baseTarget = t.split('#')[0];
    const txt = (display || baseTarget.split('/').pop()).trim();
    const escTxt = txt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const found = wikiIndex.get(baseTarget) || wikiIndex.get(baseTarget.toLowerCase());
    if (found) {
      return `<a href="#" data-wiki="${found.path}" class="wiki-link">${escTxt}</a>`;
    }
    return `<span class="wiki-broken" title="未找到: ${t.replace(/"/g, '&quot;')}">${escTxt}</span>`;
  });
}

// --- components ---

function Card({ entry, onClick }) {
  const t = TYPE_BY_ID[entry.type] || { label: entry.type, accent: 'bg-stone-100 text-stone-700 border-stone-200' };
  const themes = entry.themes || [];
  return html`
    <div class="card bg-white border border-stone-200 rounded-md p-3 hover:border-stone-400 hover:shadow-sm cursor-pointer flex flex-col gap-1.5 transition" onClick=${() => onClick(entry)}>
      <div class="flex items-center justify-between text-[11px]">
        <span class="px-1.5 py-0.5 rounded border ${t.accent}">${t.label}</span>
        <span class="text-stone-500 tabular-nums">
          ${entry.rating || ''}
          ${entry.rating && entry.year ? ' · ' : ''}
          ${entry.year || ''}
        </span>
      </div>
      <div class="font-medium text-[13px] leading-snug line-clamp-3 text-stone-900">${entry.title || entry.path.split('/').pop().replace(/\.md$/, '')}</div>
      ${entry.author && html`<div class="text-[11px] text-stone-600 line-clamp-2">${entry.author}</div>`}
      ${entry.preview && html`<div class="text-[11px] text-stone-500 line-clamp-4 leading-relaxed">${entry.preview}</div>`}
      ${themes.length > 0 && html`
        <div class="flex flex-wrap gap-1 mt-auto pt-1.5 border-t border-stone-100">
          ${themes.slice(0, 3).map(th => html`<span class="text-[10px] px-1.5 py-0.5 bg-stone-50 text-stone-600 rounded border border-stone-100">${th}</span>`)}
          ${themes.length > 3 && html`<span class="text-[10px] text-stone-400 self-center">+${themes.length - 3}</span>`}
        </div>
      `}
    </div>
  `;
}

function MiniRow({ entry, onClick }) {
  return html`
    <button onClick=${() => onClick(entry)} class="block w-full text-left px-2 py-1 rounded hover:bg-stone-100 text-[12px] leading-snug">
      <div class="flex items-center gap-1.5">
        ${entry.rating && html`<span class="text-amber-600 text-[10px] shrink-0">${entry.rating}</span>`}
        <span class="text-stone-800 line-clamp-1">${entry.title || entry.path.split('/').pop().replace(/\.md$/, '')}</span>
      </div>
      ${entry.author && html`<div class="text-[10px] text-stone-500 line-clamp-1 pl-0">${entry.author}${entry.year ? ' · ' + entry.year : ''}</div>`}
    </button>
  `;
}

function Dashboard({ type, typeEntries, themeIndex, onThemeClick, onOpen }) {
  const stats = useMemo(() => {
    const total = typeEntries.length;
    const rated = typeEntries.filter(e => e.rating_score > 0);
    const avg = rated.length ? rated.reduce((s, e) => s + e.rating_score, 0) / rated.length : 0;
    const top = [...typeEntries].sort((a, b) => (b.rating_score || 0) - (a.rating_score || 0)).slice(0, 6);

    // Top themes scoped to this type.
    const counts = new Map();
    for (const e of typeEntries) for (const th of (e.themes || [])) {
      counts.set(th, (counts.get(th) || 0) + 1);
    }
    const topThemes = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 18);

    return { total, avg, top, topThemes };
  }, [typeEntries]);

  if (stats.total === 0) return null;

  const typeMeta = TYPE_BY_ID[type] || { label: type };

  return html`
    <section class="mb-4 bg-white border border-stone-200 rounded-lg p-4 grid grid-cols-1 lg:grid-cols-[260px_1fr_320px] gap-5">
      <div class="space-y-1.5">
        <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">${typeMeta.label}</div>
        <div class="text-2xl font-semibold tabular-nums">${stats.total}</div>
        ${stats.avg > 0 && html`
          <div class="text-[12px] text-stone-600">
            平均评分 <span class="text-amber-600">${'★'.repeat(Math.round(stats.avg))}</span>
            <span class="text-stone-400 tabular-nums"> (${stats.avg.toFixed(2)})</span>
          </div>
        `}
        <div class="text-[12px] text-stone-600">${stats.topThemes.length} 个 themes</div>
      </div>

      ${stats.topThemes.length > 0 && html`
        <div class="min-w-0">
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">高频主题</div>
          <div class="flex flex-wrap gap-1.5">
            ${stats.topThemes.map(([th, n]) => html`
              <button onClick=${() => onThemeClick(th)} class="text-[11px] px-2 py-0.5 rounded border border-stone-200 bg-stone-50 hover:bg-amber-50 hover:border-amber-300 hover:text-amber-800 transition">
                ${th} <span class="text-stone-400 tabular-nums">${n}</span>
              </button>
            `)}
          </div>
        </div>
      `}

      ${stats.top.length > 0 && stats.top[0].rating_score > 0 && html`
        <div class="min-w-0 border-t lg:border-t-0 lg:border-l border-stone-200 lg:pl-5 pt-3 lg:pt-0">
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">高分推荐</div>
          <div class="space-y-0.5">
            ${stats.top.map(e => html`<${MiniRow} entry=${e} onClick=${onOpen} />`)}
          </div>
        </div>
      `}
    </section>
  `;
}

function PropertyPanel({ entry, entries, authorIndex, onOpen, onThemeClick }) {
  // Compute backlinks for this entry on the fly.
  const backlinks = useMemo(() => {
    const out = {};
    if (entry.type === 'author-profile') {
      // List works whose `author` includes this profile's title.
      const key = (entry.title || '').toLowerCase().trim();
      out.works = key ? (authorIndex.get(key) || []) : [];
      out.works = out.works.slice().sort((a, b) => (b.rating_score || 0) - (a.rating_score || 0));
    }
    if (entry.type === 'paper-analysis' || entry.type === 'book-overview') {
      // Sibling works by the same author(s); first matching author profile.
      const names = splitAuthors(entry.author);
      const siblings = new Set();
      let profile = null;
      for (const n of names) {
        const key = n.toLowerCase();
        if (!profile) profile = entries.find(e => e.type === 'author-profile' && (e.title || '').toLowerCase() === key);
        for (const w of (authorIndex.get(key) || [])) if (w.path !== entry.path) siblings.add(w);
      }
      out.authorProfile = profile;
      out.siblings = [...siblings].sort((a, b) => (b.rating_score || 0) - (a.rating_score || 0)).slice(0, 8);

      // Similar-theme papers (share ≥2 themes), capped.
      const own = new Set(entry.themes || []);
      if (own.size >= 2) {
        const scored = [];
        for (const e of entries) {
          if (e.path === entry.path) continue;
          if (e.type !== entry.type) continue;
          let n = 0;
          for (const th of (e.themes || [])) if (own.has(th)) n++;
          if (n >= 2) scored.push([n, e]);
        }
        scored.sort((a, b) => b[0] - a[0] || (b[1].rating_score || 0) - (a[1].rating_score || 0));
        out.similar = scored.slice(0, 6).map(x => x[1]);
      }
    }
    if (entry.type === 'book-overview') {
      // Already shown in left rail; no need to repeat here.
    }
    return out;
  }, [entry, entries, authorIndex]);

  const fields = [];
  if (entry.rating) fields.push(['评分', html`<span class="text-amber-600">${entry.rating}</span>`]);
  if (entry.year) fields.push(['年份', html`<span class="tabular-nums">${entry.year}</span>`]);
  if (entry.author) {
    const profile = backlinks.authorProfile;
    fields.push(['作者', profile
      ? html`<button onClick=${() => onOpen(profile)} class="text-sky-700 hover:underline text-left">${entry.author}</button>`
      : html`<span>${entry.author}</span>`
    ]);
  }
  if (entry.source) fields.push(['来源', html`<span class="text-stone-700">${entry.source}</span>`]);
  if (entry.doi) fields.push(['DOI', html`<a href="https://doi.org/${entry.doi}" target="_blank" rel="noopener" class="text-sky-700 hover:underline font-mono text-[11px] break-all">${entry.doi}</a>`]);
  if (entry.topic) fields.push(['Topic', html`<span class="text-stone-700">${entry.topic}</span>`]);
  if (entry.chapters_analyzed != null) fields.push(['章节数', html`<span class="tabular-nums">${entry.chapters_analyzed}</span>`]);

  const themes = entry.themes || [];

  return html`
    <div class="p-5 space-y-5 text-[12px] text-stone-700">
      ${fields.length > 0 && html`
        <dl class="space-y-2">
          ${fields.map(([k, v]) => html`
            <div class="grid grid-cols-[60px_1fr] gap-2">
              <dt class="text-stone-500 text-[11px] pt-0.5">${k}</dt>
              <dd class="min-w-0">${v}</dd>
            </div>
          `)}
        </dl>
      `}

      ${themes.length > 0 && html`
        <div>
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-2">主题</div>
          <div class="flex flex-wrap gap-1">
            ${themes.map(th => html`
              <button onClick=${() => onThemeClick(th)} class="text-[11px] px-1.5 py-0.5 rounded border border-stone-200 bg-stone-50 hover:bg-amber-50 hover:border-amber-300 hover:text-amber-800 transition">${th}</button>
            `)}
          </div>
        </div>
      `}

      ${backlinks.works && backlinks.works.length > 0 && html`
        <div>
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-1">作品 (${backlinks.works.length})</div>
          <div class="space-y-0.5">
            ${backlinks.works.slice(0, 30).map(w => html`<${MiniRow} entry=${w} onClick=${onOpen} />`)}
            ${backlinks.works.length > 30 && html`<div class="text-[10px] text-stone-400 pl-2">+${backlinks.works.length - 30} 条</div>`}
          </div>
        </div>
      `}

      ${backlinks.siblings && backlinks.siblings.length > 0 && html`
        <div>
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-1">同作者其他</div>
          <div class="space-y-0.5">
            ${backlinks.siblings.map(w => html`<${MiniRow} entry=${w} onClick=${onOpen} />`)}
          </div>
        </div>
      `}

      ${backlinks.similar && backlinks.similar.length > 0 && html`
        <div>
          <div class="text-[11px] uppercase tracking-wider text-stone-500 font-semibold mb-1">同主题相似</div>
          <div class="space-y-0.5">
            ${backlinks.similar.map(w => html`<${MiniRow} entry=${w} onClick=${onOpen} />`)}
          </div>
        </div>
      `}
    </div>
  `;
}

function Reader({ entry, entries, authorIndex, wikiIndex, onClose, onNavigate, onThemeClick }) {
  const [content, setContent] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!entry) return;
    setLoading(true);
    setContent('');
    fetch('/' + entry.path)
      .then(r => r.text())
      .then(t => {
        const body = t.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
        const resolved = resolveWikilinks(body, wikiIndex);
        setContent(marked.parse(resolved));
      })
      .finally(() => setLoading(false));
  }, [entry?.path, wikiIndex]);

  const onArticleClick = useCallback((e) => {
    const a = e.target.closest && e.target.closest('[data-wiki]');
    if (!a) return;
    e.preventDefault();
    const target = entries.find(x => x.path === a.dataset.wiki);
    if (target) onNavigate(target);
  }, [entries, onNavigate]);

  useEffect(() => {
    if (!entry) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [entry, onClose]);

  if (!entry) return null;

  const t = TYPE_BY_ID[entry.type] || { label: entry.type, accent: 'bg-stone-100 text-stone-700' };

  let chapters = null;
  if (entry.type === 'book-overview') {
    const slug = bookSlugOf(entry);
    if (slug) {
      chapters = entries.filter(e => e.type === 'chapter-summary' && e.book === slug);
      chapters.sort((a, b) => a.path.localeCompare(b.path));
    }
  }

  return html`
    <div class="fixed inset-0 bg-black/40 z-50 flex justify-end" onClick=${onClose}>
      <div class="w-full max-w-6xl bg-white h-full overflow-hidden shadow-2xl flex flex-col" onClick=${e => e.stopPropagation()}>
        <div class="bg-white/95 backdrop-blur border-b border-stone-200 px-6 py-3 flex items-center gap-3">
          <span class="text-[11px] px-1.5 py-0.5 rounded border ${t.accent}">${t.label}</span>
          <div class="text-[13px] font-medium text-stone-800 flex-1 truncate">${entry.title || entry.path.split('/').pop().replace(/\.md$/, '')}</div>
          ${entry.type === 'chapter-summary' && entry.book && html`
            <button
              onClick=${() => {
                const book = entries.find(e => e.type === 'book-overview' && bookSlugOf(e) === entry.book);
                if (book) onNavigate(book);
              }}
              class="text-[11px] text-stone-600 hover:text-stone-900 underline whitespace-nowrap">↑ 回到本书</button>
          `}
          <button onClick=${onClose} class="text-stone-500 hover:text-stone-900 text-lg leading-none px-2">✕</button>
        </div>
        <div class="flex-1 overflow-hidden flex min-h-0">
          ${chapters && chapters.length > 0 && html`
            <aside class="w-56 shrink-0 border-r border-stone-200 bg-stone-50 overflow-auto scrollbar-thin">
              <div class="px-4 py-3 text-[11px] uppercase tracking-wider text-stone-500 font-semibold">
                章节 (${chapters.length})
              </div>
              <ul class="pb-4">
                ${chapters.map(c => html`
                  <li>
                    <button
                      onClick=${() => onNavigate(c)}
                      class="w-full text-left px-4 py-1.5 text-[12px] text-stone-700 hover:bg-stone-100 hover:text-stone-900 leading-snug line-clamp-2">
                      ${c.title || c.path.split('/').pop().replace(/\.md$/, '')}
                    </button>
                  </li>
                `)}
              </ul>
            </aside>
          `}
          <div class="flex-1 overflow-auto scrollbar-thin min-w-0">
            ${loading
              ? html`<div class="px-8 py-10 text-sm text-stone-500">加载中…</div>`
              : html`<article onClick=${onArticleClick} class="prose-body text-[14px] text-stone-800 px-8 py-6 max-w-3xl" dangerouslySetInnerHTML=${{ __html: content }}></article>`
            }
          </div>
          <aside class="w-72 shrink-0 border-l border-stone-200 bg-stone-50/60 overflow-auto scrollbar-thin">
            <${PropertyPanel}
              entry=${entry}
              entries=${entries}
              authorIndex=${authorIndex}
              onOpen=${onNavigate}
              onThemeClick=${(th) => { onClose(); onThemeClick(th, entry.type); }}
            />
          </aside>
        </div>
      </div>
    </div>
  `;
}

function App() {
  const [entries, setEntries] = useState(null);
  const [type, setType] = useState('paper-analysis');
  const [query, setQuery] = useState('');
  const [minRating, setMinRating] = useState(0);
  const [themeFilter, setThemeFilter] = useState(null);
  const [open, setOpen] = useState(null);
  const [limit, setLimit] = useState(300);

  useEffect(() => {
    fetch('data/index.json').then(r => r.json()).then(setEntries);
  }, []);

  const counts = useMemo(() => {
    const c = {};
    if (entries) for (const e of entries) c[e.type] = (c[e.type] || 0) + 1;
    return c;
  }, [entries]);

  const wikiIndex = useMemo(() => buildWikiIndex(entries || []), [entries]);

  // author lowercase → array of entries (papers/books) whose `author` includes that name.
  const authorIndex = useMemo(() => {
    const m = new Map();
    if (!entries) return m;
    for (const e of entries) {
      if (e.type !== 'paper-analysis' && e.type !== 'book-overview') continue;
      for (const name of splitAuthors(e.author)) {
        const k = name.toLowerCase();
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(e);
      }
    }
    return m;
  }, [entries]);

  const typeEntries = useMemo(
    () => (entries || []).filter(e => e.type === type),
    [entries, type]
  );

  const filtered = useMemo(() => {
    if (!entries) return [];
    const q = query.trim().toLowerCase();
    return typeEntries.filter(e => {
      if (minRating && (e.rating_score || 0) < minRating) return false;
      if (themeFilter && !(e.themes || []).some(t => t === themeFilter)) return false;
      if (!q) return true;
      const hay = [
        e.title, e.author, e.preview, e.source, e.topic,
        ...(e.themes || []),
      ].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }, [typeEntries, query, minRating, themeFilter, entries]);

  const visible = query ? filtered : filtered.slice(0, limit);
  const isFiltered = !!(query || themeFilter || minRating);

  const switchType = useCallback((id) => {
    setType(id); setLimit(300); setThemeFilter(null);
  }, []);

  const applyThemeFilter = useCallback((th, fromType) => {
    if (fromType) setType(fromType);
    setThemeFilter(th); setQuery(''); setLimit(300);
  }, []);

  if (!entries) return html`<div class="p-10 text-stone-500">加载索引中…</div>`;

  return html`
    <div class="min-h-screen">
      <header class="bg-white/90 backdrop-blur border-b border-stone-200 sticky top-0 z-20">
        <div class="max-w-[1600px] mx-auto px-5 py-3 flex items-center gap-4 flex-wrap">
          <div class="font-semibold text-base tracking-tight">qua <span class="text-stone-400">reader</span></div>
          <nav class="flex gap-1">
            ${TYPES.map(t => html`
              <button onClick=${() => switchType(t.id)} class="px-2.5 py-1 rounded text-[12px] transition ${type === t.id ? 'bg-stone-900 text-white' : 'text-stone-600 hover:bg-stone-100'}">
                ${t.label} <span class="opacity-60 tabular-nums">${counts[t.id] || 0}</span>
              </button>
            `)}
          </nav>
          <input
            type="search"
            placeholder="搜索 标题 / 作者 / 主题 / 正文摘要…"
            value=${query}
            onInput=${e => setQuery(e.target.value)}
            class="flex-1 min-w-[200px] px-3 py-1.5 border border-stone-300 rounded text-[13px] focus:outline-none focus:border-stone-500 bg-white"
          />
          <div class="flex items-center gap-1 text-[11px] text-stone-600">
            <span>评分 ≥</span>
            ${[0, 1, 2, 3, 4].map(n => html`
              <button onClick=${() => setMinRating(n)} class="px-1.5 py-0.5 rounded ${minRating === n ? 'bg-stone-900 text-white' : 'hover:bg-stone-100'}">${n || '·'}</button>
            `)}
          </div>
          <div class="text-[11px] text-stone-500 tabular-nums">${filtered.length} / ${counts[type] || 0}</div>
        </div>
        ${themeFilter && html`
          <div class="max-w-[1600px] mx-auto px-5 pb-2 flex items-center gap-2">
            <span class="text-[11px] text-stone-500">主题筛选</span>
            <button onClick=${() => setThemeFilter(null)} class="text-[11px] px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200 hover:bg-amber-200 transition">
              ${themeFilter} <span class="text-amber-600 ml-1">✕</span>
            </button>
          </div>
        `}
      </header>
      <main class="max-w-[1600px] mx-auto px-5 py-4">
        ${!isFiltered && html`
          <${Dashboard}
            type=${type}
            typeEntries=${typeEntries}
            themeIndex=${null}
            onThemeClick=${(th) => applyThemeFilter(th, type)}
            onOpen=${setOpen}
          />
        `}
        ${filtered.length === 0
          ? html`<div class="text-sm text-stone-500 py-20 text-center">没有匹配的条目</div>`
          : html`
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2.5">
              ${visible.map(e => html`<${Card} entry=${e} onClick=${setOpen} key=${e.path} />`)}
            </div>
            ${!query && !themeFilter && filtered.length > limit && html`
              <div class="text-center mt-6">
                <button onClick=${() => setLimit(limit + 500)} class="px-4 py-2 bg-white border border-stone-300 rounded text-sm hover:bg-stone-50">
                  再加载 500 ( 已显示 ${limit} / ${filtered.length} )
                </button>
              </div>
            `}
          `
        }
      </main>
      <${Reader}
        entry=${open}
        entries=${entries}
        authorIndex=${authorIndex}
        wikiIndex=${wikiIndex}
        onClose=${() => setOpen(null)}
        onNavigate=${setOpen}
        onThemeClick=${applyThemeFilter}
      />
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
