name: MarpleiOS
options:
  bundleIdPrefix: com.quasifish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Local SwiftPM package at apple/ (Package.swift name is "Marple"); we depend
  # only on the MarpleKit product — never MarpleEmbeddings (MLX), which the
  # read-only companion does not use.
  Marple:
    path: ..

targets:
  MarpleiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MarpleiOS
    dependencies:
      - package: Marple
        product: MarpleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quasifish.marpleios
        GENERATE_INFOPLIST_FILE: YES
        # iPhone only (TARGETED_DEVICE_FAMILY 1) — matches the iPhone-only scope.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Supported orientations (iPhone): portrait + both landscapes.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Signing left to the developer's Apple ID (set the team in Xcode). Simulator
        # builds need no signing; device builds require selecting a team.
        CODE_SIGN_STYLE: Automatic
